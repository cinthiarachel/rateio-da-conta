<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rateio entre amigos</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>Rateio entre Amigos</h1>
    </header>
    <main>
        
        <div class="section">
            <h2>Participantes</h2>
            <div class="input-group">
                <label for="person-name">Adicionar Pessoa:</label>
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="person-name" placeholder="Nome da pessoa">
                    <button id="add-person">Adicionar</button>
                </div>
            </div>
            <div class="people-list" id="people-list"></div>
        </div>
        
        <div class="section">
            <h2>Itens Consumidos</h2>
            <div class="input-group">
                <label for="item-name">Nome do Item:</label>
                <input type="text" id="item-name" placeholder="Ex: Pizza, Bebida, etc.">
            </div>
            <div class="input-group">
                <label for="item-value">Valor do Item (R$):</label>
                <input type="number" id="item-value" placeholder="0.00" step="0.01" min="0">
            </div>
            <div class="input-group">
                <label>Participantes deste item:</label>
                <div class="checkbox-group" id="participants-checkbox"></div>
            </div>
            <button id="add-item">Adicionar Item</button>
            <div class="items-list" id="items-list"></div>
        </div>
        
        <div class="section">
            <h2>Resultado do Rateio</h2>
            <button id="calculate">Calcular Rateio</button>
            <div class="results" id="results"></div>
            <div class="input-group">
                <label for="include-service-tax">
                    <input type="checkbox" id="include-service-tax">
                    Incluir taxa de serviço de 10%
                </label>
            </div>
        </div>

        <div class="section">
            <button id="clear-all" class="clear-btn">Limpar tudo</button>

        </div>
    </main>
    <footer>
        <p>Desenvolvido por Cinthia Rachel</p>
    </footer>
</body>
</html>
